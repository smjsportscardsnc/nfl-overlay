<!doctype html>
<html class="src">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=220"/>
<title>Side art (right) · SMJ overlay (220x360)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@600;700;800&display=swap"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/sources.css"/>
</head>
<body class="src src-side" style="--w:220px;--h:360px">
<!-- OBS Browser Source: 220 x 360. Goes on the right of the 640 x 360 facecam frame.
     Rotating night-stadium artwork (the same for every league). -->
<main class="src-frame">
  <div class="side" data-side="right">
    <div class="sd-surface"><i class="sd-mark"></i><i class="sd-sweep"></i></div>
    <div class="sd-top"><small class="sd-kicker"></small><b class="sd-big"></b></div>
    <div class="sd-art"></div>
    <div class="sd-tag"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/leagues.js"></script>
<script src="js/moments.js"></script>
<script src="js/stadium.js"></script>
<script src="js/widgets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
