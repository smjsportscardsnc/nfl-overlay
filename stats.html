<!doctype html>
<html class="src">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=220"/>
<title>Break stats · SMJ overlay (220x360)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@600;700;800&display=swap"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/sources.css"/>
</head>
<body class="src src-stats" style="--w:220px;--h:360px">
<!-- OBS Browser Source: 220 x 360 (fits beside the 640 x 360 facecam) -->
<main class="src-frame">
  <div class="stats" id="stats">
    <div class="st-ring" id="stRing"><b id="stSold">0</b><small id="stOf">/32</small></div>
    <div class="st-k st-ring-k">SPOTS SOLD</div>
    <div class="st-div"></div>
    <div class="st-cell"><div class="st-k">AVG SPOT</div><div class="st-v" id="stAvg">—</div></div>
    <div class="st-div"></div>
    <div class="st-cell"><div class="st-k">TOTAL</div><div class="st-v" id="stTotal">—</div></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/leagues.js"></script>
<script src="js/moments.js"></script>
<script src="js/widgets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
