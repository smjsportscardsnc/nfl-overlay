<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ Overlay Control</title>
<link rel="stylesheet" href="css/control.css"/>
</head>
<body>
<header>
  <div>
    <h1>SMJ Overlay Control</h1>
    <p id="connectionStatus" class="connection warning">Loading Firebase…</p>
    <p id="commandStatus" class="command-status">Ready.</p>
  </div>
  <button class="danger" id="resetAllBtn" type="button">Reset Sold Teams</button>
</header>

<section class="panel">
  <h2>League Selection</h2>
  <div class="buttons">
    <button type="button" data-league="nfl">NFL</button>
    <button type="button" data-league="nba">NBA</button>
    <button type="button" data-league="mlb">MLB</button>
    <button type="button" data-league="nhl">NHL</button>
    <button type="button" data-league="wnba">WNBA</button>
  </div>
</section>

<section class="panel">
  <h2>Graphic Stingers</h2>
  <div class="buttons">
    <button type="button" data-stinger="stash">Stash or Pass</button>
    <button type="button" data-stinger="choose">Spin 2 Choose 1</button>
  </div>
</section>

<section class="panel">
  <h2>Overlay Text Controls</h2>
  <label>Break Title<input id="titleInput" type="text" value="SMJ NFL BREAK"/></label>
  <label>Ticker Text<input id="tickerInput" type="text" value="Welcome to SMJ Sports Cards & Collectibles!"/></label>
  <button id="saveTextBtn" type="button">Update Overlay Text</button>
</section>

<section class="panel">
  <h2>Assign Teams as Sold</h2>
  <p class="hint">Tap any team. Sold teams show a red X on the overlay.</p>
  <div id="teamControls" class="team-controls"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/leagues.js"></script>
<script src="js/control.js"></script>
</body>
</html>
