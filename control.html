<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMJ Overlay Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="control-body">
  <div class="control-shell">
    <header class="control-header">
      <div>
        <h1>SMJ Overlay Control</h1>
        <p>Compact scoreboard + full-screen animated graphics</p>
      </div>
      <button id="clearAll" class="danger">Clear Animations</button>
    </header>

    <section class="control-card">
      <h2>Break Info</h2>
      <div class="form-grid">
        <label>Break Title <input id="breakTitleInput" value="SMJ Sports Cards & Collectibles"></label>
        <label>Subtitle <input id="breakSubtitleInput" value="Singles • Rips • Breaks"></label>
        <label>Ticker <input id="tickerInput" value="Welcome to SMJ Sports Cards & Collectibles!"></label>
      </div>
      <button id="saveInfo">Update Overlay</button>
    </section>

    <section class="control-card">
      <h2>Full-Screen Graphics</h2>
      <div class="button-grid">
        <button data-trigger="stash-pass">Stash or Pass</button>
        <button data-trigger="spin-choose">Spin 2 Choose 1</button>
        <button data-trigger="big-hit">Big Hit</button>
        <button data-trigger="giveaway">Giveaway</button>
        <button data-trigger="break-full">Break Full</button>
      </div>
    </section>

    <section class="control-card">
      <h2>Lower Third</h2>
      <div class="form-grid">
        <label>Title <input id="lowerTitleInput" value="SMJ BREAKS"></label>
        <label>Text <input id="lowerTextInput" value="Follow @smjsportscardsnc"></label>
      </div>
      <button id="showLower">Show Lower Third</button>
    </section>

    <section class="control-card">
      <h2>Auction Countdown</h2>
      <div class="form-grid small">
        <label>Seconds <input id="secondsInput" type="number" min="5" max="300" value="30"></label>
      </div>
      <button id="startCountdown">Start Countdown</button>
      <button id="stopCountdown" class="secondary">Stop Countdown</button>
    </section>

    <section class="control-card">
      <h2>Recent Hits</h2>
      <div class="form-grid">
        <label>Hit Text <input id="hitInput" value="Downtown hit!"></label>
      </div>
      <button id="addHit">Add Hit</button>
      <button id="clearHits" class="secondary">Clear Hits</button>
    </section>

    <section class="control-card">
      <h2>Teams</h2>
      <div id="teamControls" class="team-controls"></div>
    </section>
  </div>
  <script src="teams.js"></script>
  <script src="control.js"></script>
</body>
</html>
