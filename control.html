<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ Control</title>
<style>
body{
background:#08111f;
color:white;
font-family:Arial,sans-serif;
padding:30px;
}
h1{margin-top:0}
.panel{
background:rgba(255,255,255,.06);
padding:20px;
border-radius:20px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.1);
}
button{
padding:16px 22px;
font-size:18px;
font-weight:700;
border:none;
border-radius:14px;
background:#0a84ff;
color:white;
cursor:pointer;
margin:8px;
}
.note{
color:#8fd8ff;
line-height:1.6;
}
</style>
</head>
<body>
<h1>SMJ Overlay Control Panel</h1>

<div class="panel">
<h2>Animation Triggers</h2>
<button onclick="alert(`Trigger in overlay browser source console:\nSMJOverlay.playVideo('stash')`)">Stash or Pass</button>
<button onclick="alert(`Trigger in overlay browser source console:\nSMJOverlay.playVideo('spin')`)">Spin 2 Choose 1</button>
<button onclick="alert(`Trigger in overlay browser source console:\nSMJOverlay.playVideo('full')`)">Break Full</button>
<button onclick="alert(`Trigger in overlay browser source console:\nSMJOverlay.playVideo('hit')`)">Big Hit</button>
<p class="note">
OBS Browser Source: 1920x1080<br>
Scoreboard remains 900x360.<br>
Fullscreen videos overlay entire stream.
</p>
</div>

</body>
</html>
