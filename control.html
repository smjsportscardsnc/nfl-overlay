<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMJ Overlay Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="control-body">
  <div class="control-shell">
    <header class="control-header">
      <div>
        <h1>SMJ Full Screen Overlay Control</h1>
        <p>Use this page from a tablet or second browser window while OBS shows index.html.</p>
      </div>
      <button id="resetBtn" class="danger-btn">Clear Break</button>
    </header>

    <section class="control-grid">
      <div class="control-card wide">
        <h2>Break Info</h2>
        <label>Break Title <input id="titleInput" value="SMJ NFL Mixer Break" /></label>
        <label>Ticker Text <input id="tickerInput" value="Welcome to SMJ Sports Cards & Collectibles!" /></label>
        <button id="saveInfoBtn">Update Overlay</button>
      </div>

      <div class="control-card">
        <h2>Full-Screen Animated Moments</h2>
        <button data-event="stash" class="big-action">Stash or Pass</button>
        <button data-event="full" class="big-action">Break Full</button>
        <button data-event="giveaway" class="big-action">Giveaway Winner</button>
        <button data-event="fire" class="big-action">🔥 Big Hit</button>
        <button id="clearEventBtn" class="secondary-btn">Clear Animation</button>
      </div>

      <div class="control-card">
        <h2>Spin 2 Choose 1</h2>
        <label>Option A <input id="spinA" value="Stash" /></label>
        <label>Option B <input id="spinB" value="Pass" /></label>
        <button id="spinBtn" class="big-action full">Run Full-Screen Spin</button>
      </div>

      <div class="control-card wide">
        <h2>NFL Teams</h2>
        <p class="small-note">Check sold, then enter the buyer username. Team logos display on the live overlay.</p>
        <div id="teamControls" class="team-controls"></div>
      </div>
    </section>
  </div>

  <script src="firebase.js"></script>
  <script src="app.js"></script>
</body>
</html>
