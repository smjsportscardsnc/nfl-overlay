<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ Firebase Control</title>
<link rel="stylesheet" href="css/control.css"/>
</head>
<body>
<header>
  <div><h1>SMJ Overlay Control</h1><p>Firebase live control for OBS overlay.</p></div>
  <button class="danger" id="resetAllBtn">Reset Sold Teams</button>
</header>

<section class="panel">
  <h2>Fullscreen Video Triggers</h2>
  <div class="buttons">
    <button data-video="stash">Stash or Pass</button>
    <button data-video="spin">Spin 2 Choose 1</button>
    <button data-video="full">Break Full</button>
    <button data-video="hit">Monster Hit</button>
  </div>
</section>

<section class="panel">
  <h2>Overlay Text Controls</h2>
  <label>Break Title<input id="titleInput" type="text"/></label>
  <label>Status<input id="statusInput" type="text"/></label>
  <label>Ticker Text<input id="tickerInput" type="text"/></label>
  <button id="saveTextBtn">Update Overlay Text</button>
</section>

<section class="panel">
  <h2>Team Sold Controls</h2>
  <p class="hint">Tap a team to toggle sold/available. Overlay team boxes remain logo-only.</p>
  <div id="teamControls" class="team-controls"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/teams.js"></script>
<script src="js/control.js"></script>
</body>
</html>
