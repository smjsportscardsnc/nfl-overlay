<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ Control</title>
<link rel="stylesheet" href="css/control.css"/>
</head>
<body>

<h1>SMJ Swoop Control Panel</h1>

<div class="panel">
  <h2>Trigger Graphics</h2>

  <div class="buttons">
    <button onclick="triggerMotion('hit')">Monster Hit</button>
    <button onclick="triggerMotion('full')">Break Full</button>
    <button onclick="triggerMotion('stash')">Stash or Pass</button>
    <button onclick="triggerMotion('winner')">Winner</button>
  </div>
</div>

<div class="panel">
  <h2>Overlay Text</h2>

  <label>Break Title</label>
  <input id="titleInput" value="SMJ NFL BREAK"/>

  <label>Status</label>
  <input id="statusInput" value="LIVE"/>

  <label>Ticker</label>
  <input id="tickerInput" value="Welcome to SMJ Sports Cards & Collectibles!"/>

  <button onclick="saveOverlay()">Save Overlay</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/control.js"></script>
</body>
</html>
