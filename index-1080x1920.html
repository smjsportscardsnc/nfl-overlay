<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ VERTICAL 1080x1920</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@600;800&display=swap"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<main class="overlay-frame">
  <section class="scoreboard-panel" id="scoreboardPanel">
    <div class="watermark"></div>
    <div class="accent-bar"></div>
    <div class="light-sweep"></div>

    <section class="top-bar">
      <div class="brand-lockup">
        <div class="smj-badge"><img src="assets/logo.png" alt="SMJ"/></div>
        <div>
          <div id="breakTitle" class="break-title">SMJ NFL BREAK</div>
          <div class="break-subtitle">singles • rips • breaks</div>
        </div>
      </div>

      <div class="right-badges">
        <div class="league-indicator" id="leagueIndicator">NFL</div>
        <div class="remaining" id="remaining">
          <span class="remaining-count" id="remainingCount">32</span><span class="remaining-label" id="remainingLabel">LEFT</span>
          <div class="progress"><span class="progress-fill" id="progressFill"></span></div>
        </div>
      </div>
    </section>

    <section class="teams-stage">
      <div id="teamsGrid" class="teams-grid"></div>
    </section>

    <footer class="ticker-wrap">
      <div class="ticker-label"><span class="live-dot"></span>LIVE</div>
      <div class="ticker-window">
        <div id="tickerText" class="ticker-text">Welcome to SMJ Sports Cards & Collectibles!</div>
      </div>
    </footer>

    <div class="sold-callout" id="soldCallout">
      <div id="calloutLogo"></div>
      <div class="callout-text">
        <span class="callout-kicker">JUST SOLD</span>
        <div class="callout-main" id="calloutMain"></div>
      </div>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/leagues.js"></script>
<script src="js/dimension-lock.js"></script>
<script src="js/app.js"></script>
</body>
</html>
