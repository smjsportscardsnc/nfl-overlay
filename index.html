<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ Team Overlay</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<main class="overlay-frame">
  <section class="scoreboard-panel">
    <div class="panel-depth"></div>
    <div class="animated-bg"></div>
    <div class="light-sweep"></div>

    <section class="top-bar">
      <div class="brand-lockup">
        <div class="smj-badge"><img src="assets/logo.png" alt="SMJ logo"/></div>
        <div class="title-stack">
          <div id="breakTitle" class="break-title">SMJ NFL MIXER BREAK</div>
          <div class="break-subtitle">singles • rips • breaks</div>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stat-card"><span>Sold</span><strong id="soldCount">0/32</strong></div>
        <div class="stat-card"><span>Status</span><strong id="statusText">Live</strong></div>
      </div>
    </section>

    <section class="teams-stage">
      <div id="teamsGrid" class="teams-grid"></div>
    </section>

    <footer class="ticker-wrap">
      <div class="ticker-label">SMJ LIVE</div>
      <div class="ticker-window">
        <div id="tickerText" class="ticker-text">Welcome to SMJ Sports Cards & Collectibles!</div>
      </div>
    </footer>
  </section>

  <div id="debugBadge" class="debug-badge hidden">Ready</div>

  <section id="videoLayer" class="video-layer hidden">
    <video id="videoStash" class="trigger-video" src="assets/videos/stash-or-pass.mp4" playsinline muted preload="auto"></video>
    <video id="videoChoose" class="trigger-video" src="assets/videos/spin-2-choose-1.mp4" playsinline muted preload="auto"></video>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/teams.js"></script>
<script src="js/app.js"></script>
</body>
</html>
