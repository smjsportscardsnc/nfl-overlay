<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ Cinematic Overlay</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<main class="overlay-frame">
  <section class="scoreboard-panel">
    <div class="panel-depth"></div>
    <div class="animated-bg"></div>
    <div class="light-sweep"></div>
    <section class="top-bar">
      <div class="brand-lockup">
        <div class="smj-badge"><img src="assets/logo.png" alt="SMJ logo"/></div>
        <div class="title-stack">
          <div id="breakTitle" class="break-title">SMJ NFL MIXER BREAK</div>
          <div class="break-subtitle">singles • rips • breaks</div>
        </div>
      </div>
      <div class="stats-strip">
        <div class="stat-card"><span>Sold</span><strong id="soldCount">0/32</strong></div>
        <div class="stat-card"><span>Status</span><strong id="statusText">Live</strong></div>
      </div>
    </section>
    <section class="teams-stage"><div id="teamsGrid" class="teams-grid"></div></section>
    <footer class="ticker-wrap">
      <div class="ticker-label">SMJ LIVE</div>
      <div class="ticker-window"><div id="tickerText" class="ticker-text">Welcome to SMJ Sports Cards & Collectibles!</div></div>
    </footer>
  </section>

  <section id="motionLayer" class="motion-layer hidden">
    <canvas id="motionCanvas" width="1920" height="1080"></canvas>
    <div id="motionHud" class="motion-hud">
      <div id="motionKicker" class="motion-kicker">SMJ LIVE</div>
      <div id="motionTitle" class="motion-title">MONSTER HIT</div>
      <div id="motionSubtitle" class="motion-subtitle">BOOM!</div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/teams.js"></script>
<script src="js/motion.js"></script>
<script src="js/app.js"></script>
</body>
</html>
