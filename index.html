<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1.0" />
<title>SMJ Break Board</title>
<style>
:root{
  --text:#ffffff;
  --muted:#9fb0cc;
  --bg:#02050b;
  --panel:#071120;
  --panel2:#0a172b;
  --line:rgba(255,255,255,.42);
  --line-soft:rgba(255,255,255,.20);
  --red:#b71c1c;
}
html,body{
  margin:0;
  padding:0;
  width:1080px;
  height:360px;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:transparent;
  color:var(--text);
}
.overlay{
  width:1080px;
  height:360px;
  box-sizing:border-box;
  padding:5px;
  display:grid;
  grid-template-rows:42px 1fr 30px;
  gap:3px;
  position:relative;
  background:
    linear-gradient(135deg, rgba(2,5,12,.98), rgba(8,23,49,.98) 32%, rgba(2,5,12,.98) 62%, rgba(25,8,12,.95));
  background-size:300% 300%;
  animation:overlayBaseShift 18s ease-in-out infinite alternate;
  border:2px solid rgba(255,255,255,.62);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.95),
    inset 0 0 24px rgba(0,0,0,.78),
    0 0 0 1px rgba(0,0,0,.9);
  overflow:hidden;
}
.overlay::before{
  content:"";
  position:absolute;
  inset:-45%;
  background:
    linear-gradient(115deg, transparent 0%, rgba(57,139,230,.28) 22%, transparent 46%),
    radial-gradient(circle at 18% 12%, rgba(40,115,190,.42), transparent 28%),
    radial-gradient(circle at 82% 78%, rgba(229,57,53,.24), transparent 31%),
    radial-gradient(circle at 52% 48%, rgba(255,255,255,.10), transparent 22%);
  animation:overlayGradientShift 10s ease-in-out infinite alternate;
  pointer-events:none;
}
.overlay::after{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(255,255,255,.28);
  pointer-events:none;
  z-index:3;
}
@keyframes overlayBaseShift{
  0%{background-position:0% 40%;}
  50%{background-position:100% 55%;}
  100%{background-position:20% 100%;}
}
@keyframes overlayGradientShift{
  0%{transform:translate3d(-3%, -2%, 0) rotate(0deg) scale(1); opacity:.75;}
  50%{transform:translate3d(2%, 3%, 0) rotate(5deg) scale(1.06); opacity:1;}
  100%{transform:translate3d(4%, -1%, 0) rotate(-3deg) scale(1.03); opacity:.85;}
}
.bar{
  position:relative;
  z-index:1;
  background:linear-gradient(180deg,#081426 0%,#03070f 100%);
  border:1px solid rgba(255,255,255,.54);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(255,255,255,.12);
  overflow:hidden;
}
.title-bar{
  display:grid;
  grid-template-columns:1fr 170px;
  align-items:center;
  padding:0 12px;
}
#title{
  text-align:left;
  padding-left:10px;
  font-weight:1000;
  font-size:28px;
  letter-spacing:.7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 0 #000, 0 0 10px rgba(97,184,255,.2);
}
.alive-box{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  background:linear-gradient(180deg,#d12626 0%,#8f1111 100%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
  border-radius:3px;
  padding:4px 10px;
}
.alive-label{
  font-size:10px;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.alive-value{
  font-size:18px;
  font-weight:1000;
}
.board{
  position:relative;
  padding:2px;
  display:grid;
  grid-template-columns:repeat(10, minmax(0,1fr));
  grid-template-rows:repeat(4, minmax(0,1fr));
  gap:2px;
  background:
    radial-gradient(circle at 18% 26%, rgba(38,119,217,.44), transparent 30%),
    radial-gradient(circle at 86% 72%, rgba(229,57,53,.34), transparent 32%),
    linear-gradient(135deg,#02050b 0%,#123365 35%,#030713 62%,#3a0b14 100%);
  background-size:340% 340%;
  animation:boardBaseShift 5.5s ease-in-out infinite alternate;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 0 18px rgba(0,0,0,.75);
}
.board::before{
  content:"";
  position:absolute;
  inset:-65%;
  background:
    conic-gradient(from 0deg at 50% 50%,
      rgba(43,126,215,.0),
      rgba(43,126,215,.42),
      rgba(255,255,255,.18),
      rgba(229,57,53,.34),
      rgba(43,126,215,.0));
  animation:ambientSpin 10s linear infinite;
  mix-blend-mode:screen;
  opacity:.72;
  z-index:0;
  pointer-events:none;
}
.board::after{
  content:"";
  position:absolute;
  inset:-45%;
  background:
    radial-gradient(circle at 12% 24%, rgba(64,152,255,.78), transparent 28%),
    radial-gradient(circle at 88% 68%, rgba(255,61,61,.54), transparent 30%),
    radial-gradient(circle at 54% 48%, rgba(255,255,255,.30), transparent 25%),
    linear-gradient(105deg, transparent 6%, rgba(255,255,255,.24) 39%, transparent 61%);
  animation:ambientMove 4.8s ease-in-out infinite alternate;
  mix-blend-mode:screen;
  opacity:.96;
  z-index:0;
  pointer-events:none;
}
@keyframes boardBaseShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:20% 100%;}
}
@keyframes ambientMove{
  0%{transform:translate(-5%, -3%) scale(1); opacity:.55;}
  50%{transform:translate(5%, 3%) scale(1.12); opacity:.95;}
  100%{transform:translate(-1%, 5%) scale(1.06); opacity:.7;}
}
@keyframes logoLift{
  0%{opacity:.52; transform:scale(.96);}
  50%{opacity:.88; transform:scale(1.04);}
  100%{opacity:.64; transform:scale(1);}
}
.team,
.center-logo{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  overflow:hidden;
}
.team{
  background:
    radial-gradient(circle at 22% 18%, rgba(65,145,255,.28), transparent 34%),
    radial-gradient(circle at 82% 76%, rgba(255,66,66,.16), transparent 34%),
    radial-gradient(circle at 50% 48%, rgba(255,255,255,.14), transparent 58%),
    linear-gradient(180deg,rgba(11,31,58,.88) 0%,rgba(2,5,11,.94) 100%);
  background-size:240% 240%;
  animation:tileGlowShift 6.5s ease-in-out infinite;
  border:1px solid rgba(255,255,255,.58);
  padding:2px;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.86),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.team::before{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:10px;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.42), rgba(97,184,255,.25) 38%, rgba(255,255,255,.07) 58%, transparent 76%);
  z-index:0;
  pointer-events:none;
  animation:logoLift 3.8s ease-in-out infinite alternate;
}
.team img{
  position:relative;
  z-index:1;
  width:60%;
  height:60%;
  object-fit:contain;
  filter:
    drop-shadow(0 2px 7px rgba(0,0,0,1))
    drop-shadow(0 0 2px rgba(255,255,255,.95))
    drop-shadow(0 0 10px rgba(255,255,255,.48))
    brightness(1.42)
    contrast(1.28)
    saturate(1.14);
}
.team.sold img{
  filter:grayscale(100%) brightness(.5);
  opacity:.75;
}
.team.sold::after{
  content:"✕";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:26px;
  font-weight:900;
  color:#ff2f2f;
  text-shadow:none;
  pointer-events:none;
  z-index:4;
}
.team.just-sold{animation:soldPop .45s ease-out;}
@keyframes soldPop{
  0%{transform:scale(.92)}
  55%{transform:scale(1.06)}
  100%{transform:scale(1)}
}
.team-code{
  position:absolute;
  z-index:2;
  top:2px;
  left:4px;
  font-size:8px;
  font-weight:1000;
  color:var(--muted);
  letter-spacing:.4px;
}
.team-username{
  position:absolute;
  z-index:3;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  max-width:92%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:7px;
  font-weight:1000;
  background:rgba(0,0,0,.88);
  color:#fff;
  padding:1px 4px;
  border-radius:3px;
  border:1px solid var(--line-soft);
}
.chaser-badges{
  position:absolute;
  z-index:3;
  top:2px;
  right:2px;
  display:flex;
  gap:2px;
  flex-wrap:wrap;
  justify-content:flex-end;
  max-width:34px;
}
.chaser-badge{
  min-width:13px;
  height:13px;
  padding:0 3px;
  border-radius:999px;
  background:#1d58d8;
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-size:7px;
  font-weight:1000;
  line-height:12px;
  text-align:center;
}
.center-logo{
  grid-column:4 / span 4;
  grid-row:2 / span 2;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.22), transparent 42%),
    radial-gradient(circle at 18% 20%, rgba(64,152,255,.48), transparent 38%),
    radial-gradient(circle at 86% 78%, rgba(255,61,61,.32), transparent 42%),
    linear-gradient(180deg,rgba(11,31,58,.92) 0%,rgba(2,5,11,.96) 100%);
  background-size:260% 260%;
  animation:tileGlowShift 5.2s ease-in-out infinite;
  border:1px solid rgba(255,255,255,.62);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.12),
    0 0 16px rgba(0,0,0,.55);
}
.center-logo img{
  width:58%;
  height:58%;
  object-fit:contain;
  filter:
    drop-shadow(0 4px 12px rgba(0,0,0,.7))
    drop-shadow(0 0 8px rgba(255,255,255,.35))
    brightness(1.12)
    contrast(1.08);
}

.center-logo::after{content:"";position:absolute;inset:-18%;background:radial-gradient(circle, rgba(97,184,255,.26), transparent 58%);animation:logoAura 8s linear infinite;z-index:1;pointer-events:none;}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
@keyframes logoAura{0%{transform:rotate(0deg) scale(1);opacity:.55}50%{transform:rotate(180deg) scale(1.08);opacity:.9}100%{transform:rotate(360deg) scale(1);opacity:.55}}

.ticker{
  display:grid;
  grid-template-columns:76px 1fr;
  align-items:stretch;
  padding:0;
  overflow:hidden;
}
.live-pill{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:11px;
  font-weight:1000;
  letter-spacing:.9px;
  text-transform:uppercase;
  background:linear-gradient(180deg,#d12626 0%,#8f1111 100%);
  border-right:1px solid rgba(255,255,255,.62);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45);
  z-index:2;
}
.ticker-window{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  min-width:0;
  background:linear-gradient(180deg,#071120 0%,#03070f 100%);
}
#tickerText{
  white-space:nowrap;
  display:inline-block;
  animation:ticker 24s linear infinite;
  font-size:11px;
  font-weight:1000;
  padding-left:100%;
}
@keyframes ticker{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}

.wheel-overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at center, rgba(28,81,139,.38), transparent 36%),linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.90));pointer-events:none;}
.wheel-overlay.show{display:flex;}
.wheel-stage{position:relative;width:520px;height:520px;display:flex;align-items:center;justify-content:center;}
#wheelCanvas{width:500px;height:500px;border-radius:50%;border:3px solid rgba(255,255,255,.8);box-shadow:0 0 32px rgba(97,184,255,.48),0 0 70px rgba(229,57,53,.22),inset 0 0 28px rgba(255,255,255,.16);}
.wheel-pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #ff3535;filter:drop-shadow(0 4px 4px rgba(0,0,0,.55));z-index:3;}
.wheel-center{position:absolute;width:112px;height:112px;border-radius:50%;background:linear-gradient(180deg,#1c518b,#071326);border:2px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:1000;letter-spacing:1px;box-shadow:0 0 26px rgba(97,184,255,.65),inset 0 0 14px rgba(255,255,255,.18);z-index:2;}
.wheel-winner{min-height:54px;margin-top:2px;padding:8px 20px;border-radius:999px;background:rgba(3,7,15,.78);border:1px solid rgba(255,255,255,.55);color:#fff;font-size:30px;font-weight:1000;text-transform:uppercase;text-shadow:0 0 14px rgba(255,255,255,.55),0 0 24px rgba(97,184,255,.5);opacity:0;transform:scale(.88);}
.wheel-winner.show{opacity:1;transform:scale(1);animation:winnerHit .72s cubic-bezier(.2,.9,.2,1);}
#confettiCanvas{position:absolute;inset:0;width:1080px;height:360px;z-index:31;pointer-events:none;}
@keyframes winnerHit{0%{opacity:0;transform:scale(.55)}45%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}

.recap{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10;
  pointer-events:none;
}
.recap.show{
  display:flex;
  animation:fade .45s;
}
.recap-card{
  padding:16px 24px;
  border-radius:16px;
  background:#071120;
  border:1px solid var(--line);
  box-shadow:0 18px 40px rgba(0,0,0,.38);
  font-size:32px;
  font-weight:1000;
  letter-spacing:1px;
}
@keyframes fade{
  from{opacity:0; transform:translateY(-14px) scale(.96)}
  to{opacity:1; transform:translateY(0) scale(1)}
}
</style>
</head>

let prevSold = {};
let lastRecapMode = false;
let recapTimer = null;
let lastSpinId = null;
let audioCtx = null;



function getAudioContext(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{});return audioCtx;}catch(e){return null;}}
function playTone(freq,duration=.05,type="square",gainValue=.035){const ctx=getAudioContext();if(!ctx)return;const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(gainValue,ctx.currentTime+.008);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration+.02);}
function playTick(){playTone(900+Math.random()*180,.035,"square",.025);}
function playWinnerHit(){playTone(220,.16,"sawtooth",.055);setTimeout(()=>playTone(440,.18,"triangle",.05),90);setTimeout(()=>playTone(880,.22,"triangle",.045),185);}
function drawOverlayWheel(names,rotation=0){const canvas=document.getElementById("wheelCanvas");if(!canvas)return;const ctx=canvas.getContext("2d");const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=Math.min(cx,cy)-18;const list=names&&names.length?names:["Add Users"];const slice=Math.PI*2/list.length;const colors=["#1c518b","#071326","#d12626","#0d2a4d","#132847","#a51414"];ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);list.forEach((name,i)=>{const start=i*slice,end=start+slice;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="rgba(255,255,255,.62)";ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.rotate(start+slice/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.shadowColor="rgba(0,0,0,.85)";ctx.shadowBlur=6;ctx.font="900 28px Arial";const text=String(name||"").length>15?String(name).slice(0,14)+"…":String(name||"");ctx.fillText(text,r-28,9);ctx.restore();});ctx.restore();ctx.beginPath();ctx.arc(cx,cy,62,0,Math.PI*2);ctx.fillStyle="#050b16";ctx.fill();ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=5;ctx.stroke();ctx.fillStyle="#fff";ctx.font="900 28px Arial";ctx.textAlign="center";ctx.fillText("SMJ",cx,cy+10);}
function launchConfetti(){const canvas=document.getElementById("confettiCanvas");if(!canvas)return;const ctx=canvas.getContext("2d");const pieces=[];const colors=["#ffffff","#61b8ff","#1c518b","#ff3535","#ffd166"];for(let i=0;i<150;i++){pieces.push({x:canvas.width/2+(Math.random()-.5)*180,y:canvas.height/2+(Math.random()-.5)*50,vx:(Math.random()-.5)*9,vy:-Math.random()*7-2,g:.18+Math.random()*.12,s:4+Math.random()*6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,c:colors[Math.floor(Math.random()*colors.length)],life:90+Math.random()*45});}let frame=0;function animate(){frame++;ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,Math.min(1,p.life/60));ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.55);ctx.restore();});if(frame<140)requestAnimationFrame(animate);else ctx.clearRect(0,0,canvas.width,canvas.height);}animate();}
function spinOverlayWheel(spinState){if(!spinState||!spinState.names||!spinState.names.length)return;const overlay=document.getElementById("wheelOverlay");const winnerEl=document.getElementById("wheelWinner");const names=spinState.names;const winner=spinState.winner||names[0];const winnerIndex=Math.max(0,names.findIndex(n=>String(n)===String(winner)));const count=names.length;const slice=Math.PI*2/count;const pointerAngle=-Math.PI/2;const targetAngle=winnerIndex*slice+slice/2;const spins=8+Math.random()*2;const finalRotation=pointerAngle-targetAngle+spins*Math.PI*2;const duration=spinState.duration||6200;const start=performance.now();let lastTickSlice=-1;overlay.classList.add("show");winnerEl.classList.remove("show");winnerEl.textContent="";function easeOutQuint(t){return 1-Math.pow(1-t,5);}function frame(now){const t=Math.min((now-start)/duration,1);const eased=easeOutQuint(t);const rot=finalRotation*eased;drawOverlayWheel(names,rot);const tickSlice=Math.floor(((((rot%(Math.PI*2))+Math.PI*2)%(Math.PI*2))/slice));if(tickSlice!==lastTickSlice&&t<.96){lastTickSlice=tickSlice;playTick();}if(t<1){requestAnimationFrame(frame);}else{drawOverlayWheel(names,finalRotation);winnerEl.textContent=`WINNER: ${winner}`;winnerEl.classList.add("show");playWinnerHit();launchConfetti();setTimeout(()=>{overlay.classList.remove("show");winnerEl.classList.remove("show");},3600);}}requestAnimationFrame(frame);}

function getLeagueData(league){
  return LEAGUES[league] || LEAGUES.nfl;
}

function buildTicker(soldTeams, leagueData){
  const all = Object.entries(soldTeams || {}).map(([key, info]) => {
    const label = leagueData.teams[key]?.label || key.toUpperCase();
    const buyer = typeof info === "string" ? info : info.buyer;
    return `${label}: ${buyer}`;
  });
  const welcome = "Welcome to SMJ Sports Cards & Collectibles!";
  return all.length ? all.join(" • ") + " • " + welcome : welcome;
}

function showRecapSplash(){
  const recap = document.getElementById("recap");
  recap.classList.remove("show");
  void recap.offsetWidth;
  recap.classList.add("show");
  if (recapTimer) clearTimeout(recapTimer);
  recapTimer = setTimeout(() => recap.classList.remove("show"), 1400);
}

function fitTitle(text){
  const el = document.getElementById("title");
  el.textContent = text || "BREAK";
  let size = 28;
  el.style.fontSize = size + "px";
  while (el.scrollWidth > el.clientWidth && size > 18) {
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

function getChaserMap(chasers, leagueData){
  const labelToKey = {};
  Object.entries(leagueData.teams).forEach(([key, team]) => {
    labelToKey[String(team.label).toLowerCase()] = key;
  });

  const map = {};
  Object.entries(chasers || {}).forEach(([spot, info]) => {
    if (!info || !info.team) return;
    const key = labelToKey[String(info.team).toLowerCase()] || String(info.team).toLowerCase();
    if (!map[key]) map[key] = [];
    map[key].push(spot);
  });
  return map;
}

function makeTeamCell(teamKey, soldTeams, chasers, leagueData){
  const wrap = document.createElement("div");
  const team = leagueData.teams[teamKey];
  if (!team) return wrap;

  const label = team.label;
  const soldInfo = soldTeams?.[teamKey];
  const chaserMap = getChaserMap(chasers, leagueData);
  const chaserAssigned = !!(chaserMap[teamKey]?.length);
  const buyer = soldInfo ? (typeof soldInfo === "string" ? soldInfo : soldInfo.buyer) : "";

  wrap.className = "team" + ((soldInfo || chaserAssigned) ? " sold" : "");
  if (soldInfo && !prevSold[teamKey]) wrap.classList.add("just-sold");

  const code = document.createElement("div");
  code.className = "team-code";
  code.textContent = label;
  wrap.appendChild(code);

  const img = document.createElement("img");
  img.src = team.logo;
  img.alt = label;
  wrap.appendChild(img);

  const badges = chaserMap[teamKey] || [];
  if (badges.length) {
    const badgeWrap = document.createElement("div");
    badgeWrap.className = "chaser-badges";
    badges.forEach(spot => {
      const badge = document.createElement("div");
      badge.className = "chaser-badge";
      badge.textContent = spot;
      badgeWrap.appendChild(badge);
    });
    wrap.appendChild(badgeWrap);
  }

  if (buyer) {
    const tag = document.createElement("div");
    tag.className = "team-username";
    tag.textContent = buyer;
    wrap.appendChild(tag);
  }

  return wrap;
}

function renderBoard(soldTeams, chasers, leagueData){
  const board = document.getElementById("board");
  board.querySelectorAll(".team").forEach(el => el.remove());

  const centerLogo = board.querySelector(".center-logo img");
  if (centerLogo) centerLogo.src = leagueData.logoPath || "./logo.png";

  const chaserMap = getChaserMap(chasers, leagueData);
  let assignedCount = 0;

  leagueData.positions.forEach(([key, col, row]) => {
    const cell = makeTeamCell(key, soldTeams, chasers, leagueData);
    cell.style.gridColumn = String(col);
    cell.style.gridRow = String(row);
    board.appendChild(cell);

    const soldInfo = soldTeams?.[key];
    const chaserAssigned = !!(chaserMap[key]?.length);
    if (soldInfo || chaserAssigned) assignedCount += 1;
  });

  document.getElementById("count").textContent = String(leagueData.total - assignedCount);
  prevSold = { ...(soldTeams || {}) };
}

onValue(ref(db, "overlayState/main"), snap => {
  const s = snap.val() || {};
  const league = s.league || "nfl";
  const leagueData = getLeagueData(league);
  const soldTeams = s.soldTeams || {};
  const chasers = s.chasers || {};

  fitTitle(s.title || leagueData.title || "BREAK");
  renderBoard(soldTeams, chasers, leagueData);

  document.getElementById("tickerText").textContent =
    s.tickerMode === "default"
      ? (s.defaultTicker || "Welcome to SMJ Sports Cards & Collectibles!")
      : buildTicker(soldTeams, leagueData);

  const spinState = s.spinState || {};
  if (spinState.spinning && spinState.id && spinState.id !== lastSpinId) {
    lastSpinId = spinState.id;
    spinOverlayWheel(spinState);
  }

  if (s.recapMode && !lastRecapMode) showRecapSplash();
  lastRecapMode = !!s.recapMode;
});
