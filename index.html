<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ Swoop Overlay</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="overlay-wrap">

<section class="scoreboard">
  <div class="scoreboard-glow"></div>

  <div class="header">
    <div class="brand">
      <img src="assets/logo.png"/>
      <div>
        <div id="breakTitle" class="title">SMJ NFL BREAK</div>
        <div class="subtitle">singles • rips • breaks</div>
      </div>
    </div>

    <div class="status-card">
      <span>Status</span>
      <strong id="statusText">LIVE</strong>
    </div>
  </div>

  <div class="ticker">
    <div class="ticker-label">SMJ LIVE</div>
    <div class="ticker-window">
      <div id="tickerText" class="ticker-text">
        Welcome to SMJ Sports Cards & Collectibles!
      </div>
    </div>
  </div>
</section>

<section id="swoopLayer" class="swoop-layer hidden">
  <div class="flash"></div>

  <div class="swoop-content">
    <div id="swoopKicker" class="swoop-kicker">SMJ LIVE</div>
    <div id="swoopTitle" class="swoop-title">MONSTER HIT</div>
    <div id="swoopSubtitle" class="swoop-subtitle">BOOM!</div>
  </div>

  <audio id="swoopAudio" preload="auto"></audio>
</section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/swoop.js"></script>
<script src="js/app.js"></script>
</body>
</html>
