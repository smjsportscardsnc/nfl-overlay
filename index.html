<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMJ Advanced Break Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="overlay-body">
  <main id="stage">
    <section id="scoreboard" class="scoreboard glass">
      <div class="score-header">
        <img src="assets/logo.png" class="brand-logo" onerror="this.style.display='none'" />
        <div class="title-wrap">
          <div id="breakTitle" class="break-title">SMJ Sports Cards & Collectibles</div>
          <div id="breakSubtitle" class="break-subtitle">Singles • Rips • Breaks</div>
        </div>
        <div class="live-badge">LIVE</div>
      </div>
      <div id="teamGrid" class="team-grid"></div>
      <div class="score-footer">
        <div id="ticker" class="ticker"><span>Welcome to SMJ Sports Cards & Collectibles!</span></div>
        <div id="countdown" class="countdown hidden">00:00</div>
      </div>
    </section>

    <aside id="recentHits" class="recent-hits glass hidden">
      <div class="panel-title">Recent Hits</div>
      <div id="hitList" class="hit-list"></div>
    </aside>

    <section id="lowerThird" class="lower-third hidden">
      <div id="lowerTitle">SMJ BREAKS</div>
      <div id="lowerText">Follow @smjsportscardsnc</div>
    </section>

    <section id="animationLayer" class="animation-layer hidden"></section>
  </main>
  <script src="teams.js"></script>
  <script src="app.js"></script>
</body>
</html>
