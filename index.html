<!doctype html>
<html lang="en">

<title>SMJ Overlay</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="overlay-body">
<main class="overlay-frame">

<section class="scoreboard-panel">
<div class="animated-bg"></div>
<div class="light-sweep"></div>

<section class="top-bar">
<div class="brand-lockup">
<div class="smj-badge">SMJ</div>
<div class="title-stack">
<div class="break-title">SMJ NFL MIXER BREAK</div>
<div class="break-subtitle">singles • rips • breaks</div>
</div>
</div>
</section>

<section class="teams-stage">
<div id="teamsGrid" class="teams-grid"></div>
</section>
</section>

<div id="videoLayer" class="video-layer hidden">
<video id="overlayVideo" playsinline></video>
</div>

</main>

<script src="js/app.js"></script>
</body>
</html>
