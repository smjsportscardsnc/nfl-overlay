<!DOCTYPE html>
<html lang="en">

<title>SMJ Break Board</title>
<style>
:root{
  --text:#ffffff;
  --muted:#9fb0cc;
  --bg:#02050b;
  --panel:#071120;
  --panel2:#0a172b;
  --line:rgba(255,255,255,.42);
  --line-soft:rgba(255,255,255,.20);
  --red:#b71c1c;
}
html,body{
  margin:0;
  padding:0;
  width:1080px;
  height:360px;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:transparent;
  color:var(--text);
}
.overlay{
  width:1080px;
  height:360px;
  box-sizing:border-box;
  padding:5px;
  display:grid;
  grid-template-rows:42px 1fr 30px;
  gap:3px;
  position:relative;
  background:
    linear-gradient(135deg, rgba(4,10,22,.98), rgba(9,20,42,.98) 35%, rgba(2,5,12,.98) 68%, rgba(14,29,55,.98));
  border:2px solid rgba(255,255,255,.62);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.95),
    inset 0 0 24px rgba(0,0,0,.78),
    0 0 0 1px rgba(0,0,0,.9);
  overflow:hidden;
}
.overlay::before{
  content:"";
  position:absolute;
  inset:-45%;
  background:
    linear-gradient(115deg, transparent 0%, rgba(28,81,139,.15) 22%, transparent 44%),
    radial-gradient(circle at 18% 12%, rgba(40,115,190,.22), transparent 26%),
    radial-gradient(circle at 84% 86%, rgba(15,62,112,.28), transparent 30%);
  animation:overlayGradientShift 12s ease-in-out infinite alternate;
  pointer-events:none;
}
.overlay::after{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(255,255,255,.28);
  pointer-events:none;
  z-index:3;
}
@keyframes overlayGradientShift{
  from{transform:translate3d(-2%, -1%, 0) rotate(0deg)}
  to{transform:translate3d(2%, 1%, 0) rotate(4deg)}
}
.bar{
  position:relative;
  z-index:1;
  background:linear-gradient(180deg,#081426 0%,#03070f 100%);
  border:1px solid rgba(255,255,255,.54);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(255,255,255,.12);
  overflow:hidden;
}
.title-bar{
  display:grid;
  grid-template-columns:1fr 170px;
  align-items:center;
  padding:0 12px;
}
#title{
  text-align:left;
  padding-left:10px;
  font-weight:1000;
  font-size:28px;
  letter-spacing:.7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 0 #000, 0 0 10px rgba(97,184,255,.2);
}
.alive-box{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  background:linear-gradient(180deg,#d12626 0%,#8f1111 100%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
  border-radius:3px;
  padding:4px 10px;
}
.alive-label{
  font-size:10px;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.alive-value{
  font-size:18px;
  font-weight:1000;
}
.board{
  position:relative;
  padding:2px;
  display:grid;
  grid-template-columns:repeat(10, minmax(0,1fr));
  grid-template-rows:repeat(4, minmax(0,1fr));
  gap:2px;
  background:
    linear-gradient(135deg,#02050b 0%,#081426 42%,#02050b 100%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 0 18px rgba(0,0,0,.75);
}
.board::after{
  content:"";
  position:absolute;
  inset:-40%;
  background:
    radial-gradient(circle at 20% 30%, rgba(28,81,139,.35), transparent 28%),
    radial-gradient(circle at 80% 70%, rgba(229,57,53,.20), transparent 30%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 25%);
  animation:ambientMove 18s ease-in-out infinite alternate;
  z-index:0;
  pointer-events:none;
}
@keyframes ambientMove{
  0%{transform:translate(-3%, -2%) scale(1); opacity:.55;}
  50%{transform:translate(3%, 2%) scale(1.08); opacity:.8;}
  100%{transform:translate(-1%, 3%) scale(1.04); opacity:.65;}
}
.team,
.center-logo{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  overflow:hidden;
}
.team{
  background:linear-gradient(180deg,#07101d 0%,#02050b 100%);
  border:1px solid rgba(255,255,255,.58);
  padding:2px;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.86),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.team::before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:8px;
  background:radial-gradient(circle, rgba(255,255,255,.10), transparent 70%);
  z-index:0;
  pointer-events:none;
}
.team img{
  position:relative;
  z-index:1;
  width:60%;
  height:60%;
  object-fit:contain;
  filter:
    drop-shadow(0 2px 6px rgba(0,0,0,.9))
    drop-shadow(0 0 6px rgba(255,255,255,.25))
    brightness(1.15)
    contrast(1.15);
}
.team.sold img{
  filter:grayscale(100%) brightness(.5);
  opacity:.75;
}
.team.sold::after{
  content:"✕";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:26px;
  font-weight:900;
  color:#ff2f2f;
  text-shadow:none;
  pointer-events:none;
  z-index:4;
}
.team.just-sold{animation:soldPop .45s ease-out;}
@keyframes soldPop{
  0%{transform:scale(.92)}
  55%{transform:scale(1.06)}
  100%{transform:scale(1)}
}
.team-code{
  position:absolute;
  z-index:2;
  top:2px;
  left:4px;
  font-size:8px;
  font-weight:1000;
  color:var(--muted);
  letter-spacing:.4px;
}
.team-username{
  position:absolute;
  z-index:3;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  max-width:92%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:7px;
  font-weight:1000;
  background:rgba(0,0,0,.88);
  color:#fff;
  padding:1px 4px;
  border-radius:3px;
  border:1px solid var(--line-soft);
}
.chaser-badges{
  position:absolute;
  z-index:3;
  top:2px;
  right:2px;
  display:flex;
  gap:2px;
  flex-wrap:wrap;
  justify-content:flex-end;
  max-width:34px;
}
.chaser-badge{
  min-width:13px;
  height:13px;
  padding:0 3px;
  border-radius:999px;
  background:#1d58d8;
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-size:7px;
  font-weight:1000;
  line-height:12px;
  text-align:center;
}
.center-logo{
  grid-column:4 / span 4;
  grid-row:2 / span 2;
  background:
    radial-gradient(circle at center, rgba(28,81,139,.24), transparent 55%),
    linear-gradient(180deg,#071426 0%,#02050b 100%);
  border:1px solid rgba(255,255,255,.62);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.12),
    0 0 16px rgba(0,0,0,.55);
}
.center-logo img{
  width:58%;
  height:58%;
  object-fit:contain;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.28));
}
.ticker{
  display:grid;
  grid-template-columns:76px 1fr;
  align-items:stretch;
  padding:0;
  overflow:hidden;
}
.live-pill{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:11px;
  font-weight:1000;
  letter-spacing:.9px;
  text-transform:uppercase;
  background:linear-gradient(180deg,#d12626 0%,#8f1111 100%);
  border-right:1px solid rgba(255,255,255,.62);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45);
  z-index:2;
}
.ticker-window{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  min-width:0;
  background:linear-gradient(180deg,#071120 0%,#03070f 100%);
}
#tickerText{
  white-space:nowrap;
  display:inline-block;
  animation:ticker 24s linear infinite;
  font-size:11px;
  font-weight:1000;
  padding-left:100%;
}
@keyframes ticker{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}
.recap{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10;
  pointer-events:none;
}
.recap.show{
  display:flex;
  animation:fade .45s;
}
.recap-card{
  padding:16px 24px;
  border-radius:16px;
  background:#071120;
  border:1px solid var(--line);
  box-shadow:0 18px 40px rgba(0,0,0,.38);
  font-size:32px;
  font-weight:1000;
  letter-spacing:1px;
}
@keyframes fade{
  from{opacity:0; transform:translateY(-14px) scale(.96)}
  to{opacity:1; transform:translateY(0) scale(1)}
}
</style>
</head>

let prevSold = {};
let lastRecapMode = false;
let recapTimer = null;

function getLeagueData(league){
  return LEAGUES[league] || LEAGUES.nfl;
}

function buildTicker(soldTeams, leagueData){
  const all = Object.entries(soldTeams || {}).map(([key, info]) => {
    const label = leagueData.teams[key]?.label || key.toUpperCase();
    const buyer = typeof info === "string" ? info : info.buyer;
    return `${label}: ${buyer}`;
  });
  const welcome = "Welcome to SMJ Sports Cards & Collectibles!";
  return all.length ? all.join(" • ") + " • " + welcome : welcome;
}

function showRecapSplash(){
  const recap = document.getElementById("recap");
  recap.classList.remove("show");
  void recap.offsetWidth;
  recap.classList.add("show");
  if (recapTimer) clearTimeout(recapTimer);
  recapTimer = setTimeout(() => recap.classList.remove("show"), 1400);
}

function fitTitle(text){
  const el = document.getElementById("title");
  el.textContent = text || "BREAK";
  let size = 28;
  el.style.fontSize = size + "px";
  while (el.scrollWidth > el.clientWidth && size > 18) {
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

function getChaserMap(chasers, leagueData){
  const labelToKey = {};
  Object.entries(leagueData.teams).forEach(([key, team]) => {
    labelToKey[String(team.label).toLowerCase()] = key;
  });

  const map = {};
  Object.entries(chasers || {}).forEach(([spot, info]) => {
    if (!info || !info.team) return;
    const key = labelToKey[String(info.team).toLowerCase()] || String(info.team).toLowerCase();
    if (!map[key]) map[key] = [];
    map[key].push(spot);
  });
  return map;
}

function makeTeamCell(teamKey, soldTeams, chasers, leagueData){
  const wrap = document.createElement("div");
  const team = leagueData.teams[teamKey];
  if (!team) return wrap;

  const label = team.label;
  const soldInfo = soldTeams?.[teamKey];
  const chaserMap = getChaserMap(chasers, leagueData);
  const chaserAssigned = !!(chaserMap[teamKey]?.length);
  const buyer = soldInfo ? (typeof soldInfo === "string" ? soldInfo : soldInfo.buyer) : "";

  wrap.className = "team" + ((soldInfo || chaserAssigned) ? " sold" : "");
  if (soldInfo && !prevSold[teamKey]) wrap.classList.add("just-sold");

  const code = document.createElement("div");
  code.className = "team-code";
  code.textContent = label;
  wrap.appendChild(code);

  const img = document.createElement("img");
  img.src = team.logo;
  img.alt = label;
  wrap.appendChild(img);

  const badges = chaserMap[teamKey] || [];
  if (badges.length) {
    const badgeWrap = document.createElement("div");
    badgeWrap.className = "chaser-badges";
    badges.forEach(spot => {
      const badge = document.createElement("div");
      badge.className = "chaser-badge";
      badge.textContent = spot;
      badgeWrap.appendChild(badge);
    });
    wrap.appendChild(badgeWrap);
  }

  if (buyer) {
    const tag = document.createElement("div");
    tag.className = "team-username";
    tag.textContent = buyer;
    wrap.appendChild(tag);
  }

  return wrap;
}

function renderBoard(soldTeams, chasers, leagueData){
  const board = document.getElementById("board");
  board.querySelectorAll(".team").forEach(el => el.remove());

  const centerLogo = board.querySelector(".center-logo img");
  if (centerLogo) centerLogo.src = leagueData.logoPath || "./logo.png";

  const chaserMap = getChaserMap(chasers, leagueData);
  let assignedCount = 0;

  leagueData.positions.forEach(([key, col, row]) => {
    const cell = makeTeamCell(key, soldTeams, chasers, leagueData);
    cell.style.gridColumn = String(col);
    cell.style.gridRow = String(row);
    board.appendChild(cell);

    const soldInfo = soldTeams?.[key];
    const chaserAssigned = !!(chaserMap[key]?.length);
    if (soldInfo || chaserAssigned) assignedCount += 1;
  });

  document.getElementById("count").textContent = String(leagueData.total - assignedCount);
  prevSold = { ...(soldTeams || {}) };
}

onValue(ref(db, "overlayState/main"), snap => {
  const s = snap.val() || {};
  const league = s.league || "nfl";
  const leagueData = getLeagueData(league);
  const soldTeams = s.soldTeams || {};
  const chasers = s.chasers || {};

  fitTitle(s.title || leagueData.title || "BREAK");
  renderBoard(soldTeams, chasers, leagueData);

  document.getElementById("tickerText").textContent =
    s.tickerMode === "default"
      ? (s.defaultTicker || "Welcome to SMJ Sports Cards & Collectibles!")
      : buildTicker(soldTeams, leagueData);

  if (s.recapMode && !lastRecapMode) showRecapSplash();
  lastRecapMode = !!s.recapMode;
});
</script>
</body>
</html>
