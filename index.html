<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1.0" />
<title>SMJ Break Board</title>
<style>
:root{
  --text:#ffffff;
  --muted:#9fb0cc;
  --bg:#02050b;
  --panel:#071120;
  --panel2:#0a172b;
  --line:rgba(255,255,255,.42);
  --line-soft:rgba(255,255,255,.20);
  --red:#b71c1c;
}
html,body{
  margin:0;
  padding:0;
  width:1080px;
  height:360px;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:transparent;
  color:var(--text);
}
.overlay{
  width:1080px;
  height:360px;
  box-sizing:border-box;
  padding:5px;
  display:grid;
  grid-template-rows:42px 1fr 30px;
  gap:3px;
  position:relative;
  background:
    linear-gradient(135deg, rgba(2,5,12,.98), rgba(8,23,49,.98) 32%, rgba(2,5,12,.98) 62%, rgba(25,8,12,.95));
  background-size:300% 300%;
  animation:overlayBaseShift 18s ease-in-out infinite alternate;
  border:2px solid rgba(255,255,255,.62);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.95),
    inset 0 0 24px rgba(0,0,0,.78),
    0 0 0 1px rgba(0,0,0,.9);
  overflow:hidden;
}
.overlay::before{
  content:"";
  position:absolute;
  inset:-45%;
  background:
    linear-gradient(115deg, transparent 0%, rgba(57,139,230,.28) 22%, transparent 46%),
    radial-gradient(circle at 18% 12%, rgba(40,115,190,.42), transparent 28%),
    radial-gradient(circle at 82% 78%, rgba(229,57,53,.24), transparent 31%),
    radial-gradient(circle at 52% 48%, rgba(255,255,255,.10), transparent 22%);
  animation:overlayGradientShift 10s ease-in-out infinite alternate;
  pointer-events:none;
}
.overlay::after{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(255,255,255,.28);
  pointer-events:none;
  z-index:3;
}
@keyframes overlayBaseShift{
  0%{background-position:0% 40%;}
  50%{background-position:100% 55%;}
  100%{background-position:20% 100%;}
}
@keyframes overlayGradientShift{
  0%{transform:translate3d(-3%, -2%, 0) rotate(0deg) scale(1); opacity:.75;}
  50%{transform:translate3d(2%, 3%, 0) rotate(5deg) scale(1.06); opacity:1;}
  100%{transform:translate3d(4%, -1%, 0) rotate(-3deg) scale(1.03); opacity:.85;}
}
.bar{
  position:relative;
  z-index:1;
  background:linear-gradient(180deg,#081426 0%,#03070f 100%);
  border:1px solid rgba(255,255,255,.54);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(255,255,255,.12);
  overflow:hidden;
}
.title-bar{
  display:grid;
  grid-template-columns:1fr 170px;
  align-items:center;
  padding:0 12px;
}
#title{
  text-align:left;
  padding-left:10px;
  font-weight:1000;
  font-size:28px;
  letter-spacing:.7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 0 #000, 0 0 10px rgba(97,184,255,.2);
}
.alive-box{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  background:linear-gradient(180deg,#d12626 0%,#8f1111 100%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
  border-radius:3px;
  padding:4px 10px;
}
.alive-label{
  font-size:10px;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.alive-value{
  font-size:18px;
  font-weight:1000;
}
.board{
  position:relative;
  padding:2px;
  display:grid;
  grid-template-columns:repeat(10, minmax(0,1fr));
  grid-template-rows:repeat(4, minmax(0,1fr));
  gap:2px;
  background:
    radial-gradient(circle at 18% 26%, rgba(38,119,217,.44), transparent 30%),
    radial-gradient(circle at 86% 72%, rgba(229,57,53,.34), transparent 32%),
    linear-gradient(135deg,#02050b 0%,#123365 35%,#030713 62%,#3a0b14 100%);
  background-size:340% 340%;
  animation:boardBaseShift 5.5s ease-in-out infinite alternate;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 0 18px rgba(0,0,0,.75);
}
.board::before{
  content:"";
  position:absolute;
  inset:-65%;
  background:
    conic-gradient(from 0deg at 50% 50%,
      rgba(43,126,215,.0),
      rgba(43,126,215,.42),
      rgba(255,255,255,.18),
      rgba(229,57,53,.34),
      rgba(43,126,215,.0));
  animation:ambientSpin 10s linear infinite;
  mix-blend-mode:screen;
  opacity:.72;
  z-index:0;
  pointer-events:none;
}
.board::after{
  content:"";
  position:absolute;
  inset:-45%;
  background:
    radial-gradient(circle at 12% 24%, rgba(64,152,255,.78), transparent 28%),
    radial-gradient(circle at 88% 68%, rgba(255,61,61,.54), transparent 30%),
    radial-gradient(circle at 54% 48%, rgba(255,255,255,.30), transparent 25%),
    linear-gradient(105deg, transparent 6%, rgba(255,255,255,.24) 39%, transparent 61%);
  animation:ambientMove 4.8s ease-in-out infinite alternate;
  mix-blend-mode:screen;
  opacity:.96;
  z-index:0;
  pointer-events:none;
}
@keyframes boardBaseShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:20% 100%;}
}
@keyframes ambientMove{
  0%{transform:translate(-5%, -3%) scale(1); opacity:.55;}
  50%{transform:translate(5%, 3%) scale(1.12); opacity:.95;}
  100%{transform:translate(-1%, 5%) scale(1.06); opacity:.7;}
}
@keyframes logoLift{
  0%{opacity:.52; transform:scale(.96);}
  50%{opacity:.88; transform:scale(1.04);}
  100%{opacity:.64; transform:scale(1);}
}
.team,
.center-logo{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  overflow:hidden;
}
.team{
  background:
    radial-gradient(circle at 22% 18%, rgba(65,145,255,.28), transparent 34%),
    radial-gradient(circle at 82% 76%, rgba(255,66,66,.16), transparent 34%),
    radial-gradient(circle at 50% 48%, rgba(255,255,255,.14), transparent 58%),
    linear-gradient(180deg,rgba(11,31,58,.88) 0%,rgba(2,5,11,.94) 100%);
  background-size:240% 240%;
  animation:tileGlowShift 6.5s ease-in-out infinite;
  border:1px solid rgba(255,255,255,.58);
  padding:2px;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.86),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.team::before{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:10px;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.42), rgba(97,184,255,.25) 38%, rgba(255,255,255,.07) 58%, transparent 76%);
  z-index:0;
  pointer-events:none;
  animation:logoLift 3.8s ease-in-out infinite alternate;
}
.team img{
  position:relative;
  z-index:1;
  width:60%;
  height:60%;
  object-fit:contain;
  filter:
    drop-shadow(0 2px 7px rgba(0,0,0,1))
    drop-shadow(0 0 2px rgba(255,255,255,.95))
    drop-shadow(0 0 10px rgba(255,255,255,.48))
    brightness(1.42)
    contrast(1.28)
    saturate(1.14);
}
.team.sold img{
  filter:grayscale(100%) brightness(.5);
  opacity:.75;
}
.team.sold::after{
  content:"✕";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:26px;
  font-weight:900;
  color:#ff2f2f;
  text-shadow:none;
  pointer-events:none;
  z-index:4;
}
.team.just-sold{
  animation:soldPop .55s ease-out, energyFlash 1.05s ease-out;
}
.team.just-sold::before{
  inset:0;
  border-radius:0;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.78), rgba(64,152,255,.48) 28%, rgba(229,57,53,.28) 48%, transparent 72%);
  animation:energyBurst 1.05s ease-out forwards;
  z-index:3;
}
.team.just-sold img{
  animation:assignedLogoHit .85s ease-out;
}
@keyframes soldPop{
  0%{transform:scale(.92)}
  55%{transform:scale(1.06)}
  100%{transform:scale(1)}
}
@keyframes energyFlash{
  0%{box-shadow:0 0 0 rgba(64,152,255,0), inset 0 0 0 1px rgba(255,255,255,.2);}
  18%{box-shadow:0 0 26px rgba(64,152,255,.95), 0 0 44px rgba(255,255,255,.38), inset 0 0 18px rgba(255,255,255,.32);}
  100%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.86), inset 0 1px 0 rgba(255,255,255,.08);}
}
@keyframes energyBurst{
  0%{opacity:0; transform:scale(.2) rotate(0deg);}
  18%{opacity:1; transform:scale(.75) rotate(8deg);}
  100%{opacity:0; transform:scale(1.9) rotate(18deg);}
}
@keyframes assignedLogoHit{
  0%{transform:scale(.86); filter:brightness(2) contrast(1.25) drop-shadow(0 0 18px rgba(255,255,255,.9));}
  40%{transform:scale(1.18);}
  100%{transform:scale(1);}
}
.team-code{
  position:absolute;
  z-index:2;
  top:2px;
  left:4px;
  font-size:8px;
  font-weight:1000;
  color:var(--muted);
  letter-spacing:.4px;
}
.team-username{
  position:absolute;
  z-index:3;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  max-width:92%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:7px;
  font-weight:1000;
  background:rgba(0,0,0,.88);
  color:#fff;
  padding:1px 4px;
  border-radius:3px;
  border:1px solid var(--line-soft);
}
.center-logo{
  grid-column:4 / span 4;
  grid-row:2 / span 2;
  background:
    radial-gradient(circle at center, rgba(255,255,255,.22), transparent 42%),
    radial-gradient(circle at 18% 20%, rgba(64,152,255,.48), transparent 38%),
    radial-gradient(circle at 86% 78%, rgba(255,61,61,.32), transparent 42%),
    linear-gradient(180deg,rgba(11,31,58,.92) 0%,rgba(2,5,11,.96) 100%);
  background-size:260% 260%;
  animation:tileGlowShift 5.2s ease-in-out infinite;
  border:1px solid rgba(255,255,255,.62);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.12),
    0 0 16px rgba(0,0,0,.55);
}
.center-logo::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    conic-gradient(from 0deg,
      rgba(64,152,255,.0),
      rgba(64,152,255,.40),
      rgba(255,255,255,.18),
      rgba(229,57,53,.28),
      rgba(64,152,255,.0));
  animation:logoAura 8s linear infinite;
  mix-blend-mode:screen;
  opacity:.78;
  z-index:0;
  pointer-events:none;
}
.center-logo img{
  position:relative;
  z-index:1;
  width:58%;
  height:58%;
  object-fit:contain;
  animation:logoPulse 3.1s ease-in-out infinite;
  filter:
    drop-shadow(0 4px 12px rgba(0,0,0,.75))
    drop-shadow(0 0 8px rgba(255,255,255,.48))
    drop-shadow(0 0 20px rgba(64,152,255,.62))
    drop-shadow(0 0 34px rgba(64,152,255,.34))
    brightness(1.18)
    contrast(1.12);
}
@keyframes logoPulse{
  0%{
    transform:scale(1);
    filter:
      drop-shadow(0 4px 12px rgba(0,0,0,.75))
      drop-shadow(0 0 7px rgba(255,255,255,.34))
      drop-shadow(0 0 14px rgba(64,152,255,.42))
      brightness(1.12)
      contrast(1.08);
  }
  50%{
    transform:scale(1.055);
    filter:
      drop-shadow(0 4px 12px rgba(0,0,0,.75))
      drop-shadow(0 0 13px rgba(255,255,255,.68))
      drop-shadow(0 0 28px rgba(64,152,255,.9))
      drop-shadow(0 0 44px rgba(229,57,53,.28))
      brightness(1.28)
      contrast(1.16);
  }
  100%{
    transform:scale(1);
    filter:
      drop-shadow(0 4px 12px rgba(0,0,0,.75))
      drop-shadow(0 0 7px rgba(255,255,255,.34))
      drop-shadow(0 0 14px rgba(64,152,255,.42))
      brightness(1.12)
      contrast(1.08);
  }
}
@keyframes logoAura{
  0%{transform:rotate(0deg) scale(1); opacity:.55;}
  50%{transform:rotate(180deg) scale(1.08); opacity:.95;}
  100%{transform:rotate(360deg) scale(1); opacity:.55;}
}
.ticker{
  display:grid;
  grid-template-columns:76px 1fr;
  align-items:stretch;
  padding:0;
  overflow:hidden;
}
.live-pill{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:11px;
  font-weight:1000;
  letter-spacing:.9px;
  text-transform:uppercase;
  background:linear-gradient(180deg,#d12626 0%,#8f1111 100%);
  border-right:1px solid rgba(255,255,255,.62);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45);
  z-index:2;
}
.ticker-window{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  min-width:0;
  background:linear-gradient(180deg,#071120 0%,#03070f 100%);
}
#tickerText{
  white-space:nowrap;
  display:inline-block;
  animation:ticker 24s linear infinite;
  font-size:11px;
  font-weight:1000;
  padding-left:100%;
}
@keyframes ticker{
  from{transform:translateX(0)}
  to{transform:translateX(-100%)}
}
.recap{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10;
  pointer-events:none;
}
.recap.show{
  display:flex;
  animation:fade .45s;
}
.recap-card{
  padding:16px 24px;
  border-radius:16px;
  background:#071120;
  border:1px solid var(--line);
  box-shadow:0 18px 40px rgba(0,0,0,.38);
  font-size:32px;
  font-weight:1000;
  letter-spacing:1px;
}
@keyframes fade{
  from{opacity:0; transform:translateY(-14px) scale(.96)}
  to{opacity:1; transform:translateY(0) scale(1)}
}
</style>
</head>

let prevSold = {};
let lastRecapMode = false;
let recapTimer = null;

function getLeagueData(league){
  return LEAGUES[league] || LEAGUES.nfl;
}

function buildTicker(soldTeams, leagueData){
  const all = Object.entries(soldTeams || {}).map(([key, info]) => {
    const label = leagueData.teams[key]?.label || key.toUpperCase();
    const buyer = typeof info === "string" ? info : info.buyer;
    return `${label}: ${buyer}`;
  });
  const welcome = "Welcome to SMJ Sports Cards & Collectibles!";
  return all.length ? all.join(" • ") + " • " + welcome : welcome;
}

function showRecapSplash(){
  const recap = document.getElementById("recap");
  recap.classList.remove("show");
  void recap.offsetWidth;
  recap.classList.add("show");
  if (recapTimer) clearTimeout(recapTimer);
  recapTimer = setTimeout(() => recap.classList.remove("show"), 1400);
}

function fitTitle(text){
  const el = document.getElementById("title");
  el.textContent = text || "BREAK";
  let size = 28;
  el.style.fontSize = size + "px";
  while (el.scrollWidth > el.clientWidth && size > 18) {
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

function makeTeamCell(teamKey, soldTeams, leagueData){
  const wrap = document.createElement("div");
  const team = leagueData.teams[teamKey];
  if (!team) return wrap;

  const label = team.label;
  const soldInfo = soldTeams?.[teamKey];
  const buyer = soldInfo ? (typeof soldInfo === "string" ? soldInfo : soldInfo.buyer) : "";

  wrap.className = "team" + (soldInfo ? " sold" : "");
  if (soldInfo && !prevSold[teamKey]) wrap.classList.add("just-sold");

  const code = document.createElement("div");
  code.className = "team-code";
  code.textContent = label;
  wrap.appendChild(code);

  const img = document.createElement("img");
  img.src = team.logo;
  img.alt = label;
  wrap.appendChild(img);


  if (buyer) {
    const tag = document.createElement("div");
    tag.className = "team-username";
    tag.textContent = buyer;
    wrap.appendChild(tag);
  }

  return wrap;
}

function renderBoard(soldTeams, leagueData){
  const board = document.getElementById("board");
  board.querySelectorAll(".team").forEach(el => el.remove());

  const centerLogo = board.querySelector(".center-logo img");
  if (centerLogo) centerLogo.src = leagueData.logoPath || "./logo.png";

  let assignedCount = 0;

  leagueData.positions.forEach(([key, col, row]) => {
    const cell = makeTeamCell(key, soldTeams, leagueData);
    cell.style.gridColumn = String(col);
    cell.style.gridRow = String(row);
    board.appendChild(cell);

    const soldInfo = soldTeams?.[key];
    if (soldInfo) assignedCount += 1;
  });

  document.getElementById("count").textContent = String(leagueData.total - assignedCount);
  prevSold = { ...(soldTeams || {}) };
}

onValue(ref(db, "overlayState/main"), snap => {
  const s = snap.val() || {};
  const league = s.league || "nfl";
  const leagueData = getLeagueData(league);
  const soldTeams = s.soldTeams || {};

  fitTitle(s.title || leagueData.title || "BREAK");
  renderBoard(soldTeams, leagueData);

  document.getElementById("tickerText").textContent =
    s.tickerMode === "default"
      ? (s.defaultTicker || "Welcome to SMJ Sports Cards & Collectibles!")
      : buildTicker(soldTeams, leagueData);

  if (s.recapMode && !lastRecapMode) showRecapSplash();
  lastRecapMode = !!s.recapMode;
});
