<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SMJ 9x16 Overlay V2 HARD-CODED</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@600;700;800&display=swap"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<main class="overlay-frame">
  <section class="scoreboard-panel" id="scoreboardPanel">
    <header class="top-bar">
      <div class="smj-badge"><img src="assets/logo.png" alt="SMJ"/></div>
      <div class="brand-text">
        <div id="breakTitle" class="break-title">SMJ NFL BREAK</div>
        <div id="breakSubtitle" class="break-subtitle">singles • rips • breaks</div>
      </div>
      <div class="remaining" id="remaining">
        <div class="remaining-count"><span id="remainingCount">32</span><em id="remainingTotal">/32</em></div>
        <div class="remaining-label" id="remainingLabel">SPOTS LEFT</div>
      </div>
      <div class="progress-segs" id="progressSegs"></div>
      <div class="league-indicator" id="leagueIndicator" hidden>NFL</div>
    </header>

    <section class="teams-stage">
      <div id="teamsGrid" class="teams-grid"></div>
    </section>

    <div class="takeover" id="takeover">
      <div class="to-rays"></div>
      <div class="to-pattern" id="takeoverPattern"></div>
      <div class="to-logo" id="takeoverLogo"></div>
      <div class="to-text">
        <span class="to-kicker">SOLD</span>
        <div class="to-team"><small id="takeoverCity"></small><span id="takeoverName"></span></div>
        <div class="to-buyer" id="takeoverBuyer"></div>
      </div>
      <div class="to-wipe"></div>
      <div class="to-confetti" id="takeoverConfetti"></div>
    </div>
  </section>

  <footer class="ticker-wrap">
    <div class="ticker-label"><span class="live-dot"></span>LIVE</div>
    <div class="ticker-window">
      <div id="tickerText" class="ticker-text">Welcome to SMJ Sports Cards & Collectibles!</div>
    </div>
  </footer>

  <div class="moment" id="moment">
    <div class="gm-dim"></div>
    <div class="gm-band b1"></div>
    <div class="gm-band b2"></div>
    <div class="gm-rays"></div>
    <div class="gm-ring"></div>
    <div class="gm-card">
      <div class="gm-face">
        <img class="gm-logo" src="assets/logo.png" alt=""/>
        <div class="gm-title" id="momentTitle"></div>
        <div class="gm-shine"></div>
      </div>
    </div>
    <div id="momentSparks"></div>
    <div class="gm-flash"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/leagues.js"></script>
<script src="js/moments.js"></script>
<script src="js/widgets.js"></script>
<script src="js/dimension-lock.js"></script>
<script src="js/app.js"></script>
</body>
</html>
