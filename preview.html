<!doctype html>
<html><head><meta charset="utf-8"/><title>Video Preview</title>
<style>body{background:#06101f;color:white;font-family:Arial;padding:24px}button{padding:14px 18px;border:0;border-radius:14px;background:#078cff;color:white;font-weight:900;margin:6px}video{display:block;width:960px;max-width:100%;margin-top:20px}</style>
</head><body>
<h1>Uploaded Video Preview</h1>
<button onclick="play('assets/videos/stash-or-pass.mp4')">Stash or Pass</button>
<button onclick="play('assets/videos/spin-2-choose-1.mp4')">Spin 2 Choose 1</button>
<video id="v" controls muted></video>
<script>function play(src){const v=document.getElementById('v');v.src=src+'?v='+Date.now();v.play();}</script>
</body></html>
