<!doctype html>
<html>
<head><meta charset="utf-8"><title>WebM Stinger Preview</title>
<style>body{background:#06101f;color:white;font-family:Arial;padding:24px}button{padding:14px 18px;margin:6px;border:0;border-radius:12px;background:#078cff;color:white;font-weight:900}video{display:block;width:960px;max-width:100%;margin-top:20px;background:transparent}</style>
</head>
<body>
<h1>WebM Stinger Preview</h1>
<button onclick="play('assets/stingers/stash-or-pass.webm')">Stash/Pass WebM</button>
<button onclick="play('assets/stingers/spin-2-choose-1.webm')">Spin WebM</button>
<button onclick="play('assets/stingers/stash-or-pass.mp4')">Stash MP4 Fallback</button>
<button onclick="play('assets/stingers/spin-2-choose-1.mp4')">Spin MP4 Fallback</button>
<video id="v" controls></video>
<script>
function play(src){
  const v=document.getElementById('v');
  v.src=src+'?v='+Date.now();
  v.muted=false;
  v.volume=1;
  v.play();
}
</script>
</body></html>
